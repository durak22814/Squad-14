- type: entity
  id: SquadSupplyTruckBase
  abstract: true
  save: false
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/vehicles2.rsi
    state: truck_cargo
    noRot: true
  - type: Appearance
  - type: AmbientSound
    sound: "/Audio/Effects/Vehicle/vehicleengineidle.ogg"
    range: 10
    volume: -10
    enabled: false
  - type: InputMover
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.65
        density: 150
        mask:
          - MobMask
          - HighImpassable
          - MidImpassable
          - LowImpassable
        layer:
          - MobLayer
          - MidImpassable
        hard: true
  - type: MovementSpeedModifier
    baseAcceleration: 8
    baseFriction: 0.25
    baseSprintSpeed: 8.5
    baseWalkSpeed: 4.5
  - type: SquadTruck
    maxCargoUnits: 6
    maxPassengers: 4
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: RequireProjectileTarget

