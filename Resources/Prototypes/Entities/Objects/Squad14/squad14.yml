- type: entity
  id: SquadFpvDrone
  name: FPV-дрон камикадзе
  description: Высокоскоростной ударный квадрокоптер с кумулятивно-осколочным зарядом.
  components:
  - type: Sprite
    sprite: Mobs/Silicon/drone.rsi
    state: shell
    noRot: true
  - type: Eye
    drawFov: true
  - type: InputMover
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 15
        mask:
          - Impassable
          - HighImpassable
          - MidImpassable
          - MobMask
        layer:
          - MobLayer
        hard: true
  - type: MovementSpeedModifier
    baseWalkSpeed: 7.5
    baseSprintSpeed: 12.0
    baseAcceleration: 15
  - type: PointLight
    radius: 3.5
    energy: 2.0
    color: "#FF3333"
  - type: AmbientSound
    volume: 2
    range: 14
    enabled: false
    sound:
      path: /Audio/Effects/fpv.ogg
  - type: SquadFpvDrone
    maxRange: 65
    detonateOnCollide: true
    explosionIntensity: 35
    explosionSlope: 3
    explosionMaxIntensity: 4
  - type: Pullable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

